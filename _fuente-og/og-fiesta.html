<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Parisienne&family=DM+Sans:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:url(../img/portada.webp) center 30%/cover;font-family:"Cormorant Garamond",serif}
.brillos{position:absolute;inset:0;background:url(../img/destellos.webp) center/cover;mix-blend-mode:screen;opacity:.6}
.velo{position:absolute;inset:0;background:radial-gradient(62% 75% at 32% 50%,rgba(255,247,244,.9),rgba(255,247,244,0) 78%)}
.texto{position:absolute;left:60px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.t0{font:500 22px "DM Sans",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#b76e79}
.t1{margin-top:10px;font:400 64px/1 Parisienne,cursive;color:#8f4f5a}
.t2{font:600 140px/1.02 "Cormorant Garamond",serif;color:#5a3a3f;letter-spacing:.02em}
.t3{margin-top:12px;font:600 40px "Cormorant Garamond",serif;color:#5a3a3f}
.t4{margin-top:4px;font:italic 500 34px "Cormorant Garamond",serif;color:#8d6b70}
.globos{position:absolute;right:40px;top:50%;width:500px;transform:translateY(-50%) rotate(3deg);filter:drop-shadow(0 26px 26px rgba(143,79,90,.3))}
.m{position:absolute;filter:drop-shadow(0 8px 10px rgba(110,50,60,.25))}
</style></head><body>
<div class="brillos"></div><div class="velo"></div>
<img class="globos" src="../img/globos-40.webp">
<img class="m" src="../img/mariposas/m2.webp" style="width:120px;left:640px;top:36px;transform:rotate(-12deg)">
<img class="m" src="../img/mariposas/m6.webp" style="width:100px;right:60px;bottom:30px;transform:rotate(10deg)">
<div class="texto"><p class="t0">Te invitamos</p><p class="t1">a celebrar los 40 de</p><p class="t2">Mile</p><p class="t3">Viernes 27 de nov · 8:30 p. m.</p><p class="t4">René BBQ 🍻</p></div>
</body></html>
