<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Parisienne&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:url(../img/portada.webp) center 30%/cover;font-family:"Cormorant Garamond",serif}
.brillos{position:absolute;inset:0;background:url(../img/destellos.webp) center/cover;mix-blend-mode:screen;opacity:.6}
.velo{position:absolute;inset:0;background:radial-gradient(60% 70% at 32% 50%,rgba(255,247,244,.85),rgba(255,247,244,0) 75%)}
.texto{position:absolute;left:70px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.t1{font:400 76px/1 Parisienne,cursive;color:#8f4f5a}
.t2{font:600 150px/1.05 "Cormorant Garamond",serif;color:#5a3a3f;letter-spacing:.02em}
.t3{margin-top:14px;font:italic 500 38px "Cormorant Garamond",serif;color:#8d6b70}
.globos{position:absolute;right:40px;top:50%;width:520px;transform:translateY(-50%) rotate(3deg);filter:drop-shadow(0 26px 26px rgba(143,79,90,.3))}
.m{position:absolute;filter:drop-shadow(0 8px 10px rgba(110,50,60,.25))}
</style></head><body>
<div class="brillos"></div><div class="velo"></div>
<img class="globos" src="../img/globos-40.webp">
<img class="m" src="../img/mariposas/m2.webp" style="width:130px;left:600px;top:40px;transform:rotate(-12deg)">
<img class="m" src="../img/mariposas/m6.webp" style="width:110px;right:60px;bottom:30px;transform:rotate(10deg)">
<img class="m" src="../img/mariposas/m1.webp" style="width:90px;left:40px;bottom:40px;transform:rotate(-8deg)">
<div class="texto"><p class="t1">Escríbele a</p><p class="t2">Mile</p><p class="t3">Deja tu mensaje · ¡es sorpresa! 🤫</p></div>
</body></html>
